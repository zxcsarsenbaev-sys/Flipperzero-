
name: Build Cyber Hunter APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download project ZIP
        run: |
          unzip -o CyberHunterAndroid-Project.zip -d source
          find source -maxdepth 4 -type f | head -100

      - name: Check Android project
        run: |
          test -f source/CyberHunterAndroid/settings.gradle.kts
          test -f source/CyberHunterAndroid/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source/CyberHunterAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberHunter-debug-apk
          path: source/CyberHunterAndroid/app/build/outputs/apk/debug/app-debug.apk
          
